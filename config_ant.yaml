environment_parameters:
 mod_invata: 0.0
behaviors:
 AgentGolf:
  trainer_type: ppo
  hyperparameters:
   learning_rate: 3.0e-4
   learning_rate_schedule: linear
   batch_size: 2048
   buffer_size: 81920
   beta: 5.0e-3
   epsilon: 0.2
   lambd: 0.95
   num_epoch: 3
  network_settings:
   normalize: true
   hidden_units: 512
   num_layers: 3
   vis_encode_type: simple
  reward_signals:
   extrinsic:
    gamma: 0.999
    strength: 1.0
   curiosity:
    strength: 0.15
    gamma: 0.99
  max_steps: 30000000
  time_horizon: 2048
  summary_freq: 10000
  keep_checkpoints: 5
  checkpoint_interval: 10000
  